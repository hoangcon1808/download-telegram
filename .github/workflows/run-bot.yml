name: Telegram Bot Runner

on:
  push:
    branches:
      - main
  # Tự động chạy lại mỗi 5 tiếng rưỡi để tránh giới hạn timeout 6 tiếng của GitHub Actions
  schedule:
    - cron: "30 */5 * * *"
  workflow_dispatch: # Cho phép bấm nút kích hoạt thủ công

# Cơ chế kiểm soát luồng: Chặn bot chạy đè lên nhau gây lỗi 409
concurrency:
  group: telegram-bot-polling
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram Bot
        env:
          # Các biến môi trường lấy từ GitHub Secrets
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python main.py
